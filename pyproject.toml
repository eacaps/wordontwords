[project]
name = "wordontwords"
version = "0.0.0"
description = "A Hamilton DAG that ingests used Wordle words from fiveforks.com (mirrors eacaps/wordle-words)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "sf-hamilton>=1.70",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
]

[project.optional-dependencies]
viz = ["sf-hamilton[visualization]"]

[project.scripts]
wordontwords = "wordontwords.run:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.semantic_release]
# Keep the version in pyproject.toml's [project] table in sync with the tag.
version_toml = ["pyproject.toml:project.version"]
# Only release from main.
branch = "main"
# Build an sdist/wheel so the GitHub release has artifacts (optional but handy).
build_command = "pip install build && python -m build"
# Commit message used when PSR bumps the version. Conventional + [skip ci] so the
# release commit doesn't retrigger CI.
commit_message = "chore(release): {version} [skip ci]"

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.commit_parser_options]
# Conventional Commits: which type prefixes trigger which bump.
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]
# A "!" or "BREAKING CHANGE:" footer triggers a major bump by default.

[tool.semantic_release.changelog]
exclude_commit_patterns = ["^chore\\(release\\):"]
